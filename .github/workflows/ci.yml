name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-system native
      # Stejny skript jako lokalne, aby CI zkouselo totez co vyvojar.
      - name: Test
        run: ./Scripts/test.sh
